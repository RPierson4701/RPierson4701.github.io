<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <main class="container">
        <div class="row">
            <div class="col-6" style = "display: flex; align-items: center">
                <img src = "NYSImage.png" alt = "New York State Logo" width = 120px>
                <h3>Department of Motor Vehicles</h3>
            </div>
            <div class="col-6">
                have the right side here
            </div>
        </div>

        <button id = "toBeClicked" defer>Click Me!</button>

        <button id = "buttonA">Press Me</button>
        <h3 id = "headingA"></h3>

        <input id = "textBox" type = "text">
        <div id = "output"></div>

        <hr>
        <div id = "box" style = "width: 300px; height: 100px; background-color: lavender">
            <p id = "message">Critical Information to Be Revealed</p>
            <button id = "changeText">Click Here</button>
        </div>

        <input type = "text" id = "textInput" placeholder = "How are you so awesome?">

        <ul class = "favCoffeeList cute">
            <li class = "item">Cappuccino</li>
            <li class = "item">Macchiato</li>
            <li class = "item">Latte</li>
        </ul>

        <div id = "content">Old Content</div>

        <button id = "randomButton">Generate Random Number</button>
        <p id = "randomOutput"></p>

        <ul id = "itemList">
            <button id = "addItem">Click me to populate the list</button>
        </ul>
    </main>

    <script src = "myForm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
