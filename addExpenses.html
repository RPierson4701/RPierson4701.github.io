<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siena Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
</head>

<body>
    <main class="container">
        <form id="expensesForm" type="get" action="addExpenses.html">
            <fieldset>
            <legend><h2>Add Expenses</h2></legend>
            <div class="row align-items-center mb-3">
                <label for="expenseSource" class="form-label">Expense Source Name: </label>
                <input class = "form-control" type="text" id="expenseSource" required pattern="[.{5,}]">
            </div>
            <div class="row align-items-center mb-3">
                <label for="expenseDate" class="form-label">Expense Date: </label>
                <input class = "form-control" type="date" id="expenseDate" required>
            </div>
            <div class="row align-items-center mb-3">
                <label for="expenseAmount" class="form-label">Expense Amount: </label>
                <input class = "form-control" type="text" id="expenseAmount" required pattern="([1-4]{0,1}[0-9]{1,4}(\.[0-9]{2}){0,1})|(\.[0-9]{2})"
                    title="Enter a number greater than zero and less than 50000.">
            </div>
            <div class="row align-items-center mb-3">
                <label for="expenseCategory" class="form-label">Expense Category: </label>
                <input class = "form-control" type="text" id="expenseCategory">
            </div>
            <div class="row align-items-center mb-3">
                <label for="paymentMode" class="form-label">Mode of Payment: </label>
                <select class = "form-select"  name="frequency" id="frequency">
                    <option value="credit">Credit Card</option>
                    <option value="debit">Debit Card</option>
                    <option value="cash">Cash</option>
                </select>
            </div>
            <div class="row align-items-center mb-3">
                <label for="rational" class="form-label">Expense Source Name: </label>
                <input class = "form-control" type="text" id="rational" pattern="[.{0,100}]">
            </div>
            <div class = "row align-items-center">
                <input type="submit" value="Submit" class="btn btn-primary">
            </div>
            </fieldset>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="expense.js" defer></script>
</body>

</html>
