<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siena Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
</head>

<body>
    <main class="container">
        <form id="financeForm" type="get" action="addExpenses.html">
            <fieldset>
            <legend><h2>Add Income</h2></legend>
            <div class="row align-items-center mb-3">
                <label for="incomeSource" class="form-label">Income Source Name: </label>
                <input class = "form-control" type="text" id="incomeSource" required pattern="[.{3,}]">
            </div>
            <div class="row align-items-center mb-3">
                <label for="amount" class="form-label">Amount: </label>
                <input class = "form-control" type="text" id="amount" required pattern="[0-9][0-9]*(\.[0-9]{2}){0,1}"
                    title="Enter a number greater than zero, you may include a dollar amount with cents.">
            </div>
            <div class="row align-items-center mb-3">
                <label for="frequency" class="form-label" >Frequency: </label>
                <select class = "form-select"  name="frequency" id="frequency">
                    <option value="oneTime">One-Time</option>
                    <option value="monthly">Monthly</option>
                    <option value="biWeekly">Bi-Weekly</option>
                    <option value="yearly">Yearly</option>
                </select>
            </div>
            <div class = "row align-items-center">
                <input type="submit" value="Submit" class="btn btn-primary">
            </div>
            </fieldset>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="finance.js" defer></script>
</body>

</html>
