<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
</head>

<body>
    <section class="container">
        <form id="characterForm" type="get" action="page3.html">

            <h1>Choose Your Character</h1>

            <fieldset>
                <legend>Choose Your Character</legend>
                <fieldset>
                    <input type="radio" id="atw" name="pickChar" value="atw">
                    <label for="atw"><strong>Aria, the Warrior:</strong> Strong and brave, with the ability to overcome
                        physical obstacles.</label>
                </fieldset>
                <fieldset>
                    <input type="radio" id="etm" name="pickChar" value="etm">
                    <label for="etm"><strong>Eldrin, the Mage:</strong> Wise and knowledgeable, with the power to solve
                        puzzes and cast spells.</label>
                </fieldset>
                <fieldset>
                    <input type="radio" id="ttr" name="pickChar" value="ttr">
                    <label for="ttr"><strong>Tara, the Rogue:</strong> Quick and cunning, with skills in stealth and
                        persuasion.</label>
                </fieldset>
            </fieldset>
            <input type="submit" value = "Continue">
        </form>
    </section>
</body>

</html>
