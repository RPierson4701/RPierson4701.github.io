<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Path of Stealth</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
</head>

<body>
    <section class="container">

        <h1>The Path of Stealth</h1>
        <p>To successfully navigate the Path of Stealth, you must choose your actions carefully. Select the correct
            sequence of actions to avoid detection and reach your objective.</p>
        <!-- Actions -->
        <div onclick="selectAction(this, 'hide')" class="stealth-option">Hide in the shadows</div>
        <div onclick="selectAction(this, 'run')" class="stealth-option">Run quickly to the next cover</div>
        <div onclick="selectAction(this, 'distract')" class="stealth-option">Create a distraction</div>
        <div onclick="selectAction(this, 'wait')" class="stealth-option">Wait for the right moment</div>
        <!-- Buttons -->
        <button onclick="checkSequence()">Check Sequence</button>
        <button onclick="reset()">Reset!</button>
        <script>
            const correctSequence = ['hide', 'wait', 'distract'];
            // Your Code here
            const currentSequence = [];

            function selectAction(divTag, action){
                let seen = false;
                for (i = 0; i < currentSequence.length; i++){
                    if (currentSequence[i] === action){
                        seen = true;
                        //This removes a single element at index i from the array
                        currentSequence.splice(i, 1);
                        divTag.style.backgroundColor = "#f0f0f0";
                    }
                }
                if (seen == false){
                    currentSequence.push(action);
                    divTag.style.backgroundColor = "yellow";
                }
                
            }

            function checkSequence(){
                if (currentSequence.join() == correctSequence.join()){
                    alert("The buttons have been pressed in the correct order");
                    window.location.href = "page6.html";
                }
                else {
                    reset();
                }
            }

            function reset(){
                currentSequence.length = 0;

                let list = document.querySelectorAll(".stealth-option");
                for (const element of list){
                    element.style.backgroundColor ="#f0f0f0";
                }
                
            }
        </script>
    </section>
</body>

</html>
